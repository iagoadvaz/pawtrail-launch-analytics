<title>PawTrail Launch Workbook</title>
<style>
:root{
  color-scheme: light;
  --ground:#eef0f4; --surface:#fbfcfd; --surface-2:#f3f5f8;
  --ink:#12151a; --ink-2:#4a515c; --ink-3:#767e8b;
  --rule:#dde1e8; --rule-2:#c8cdd7;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4;
  --good:#1a7f4b; --good-bg:#e4f2ea; --warn:#9a6800; --warn-bg:#fbf0d8;
  --crit:#b3261e; --crit-bg:#fbe6e4;
  --grid:#e6e9ef; --tabbar:#e3e6ec;
  --ui:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --ground:#0e1013; --surface:#171a1f; --surface-2:#1e222a;
    --ink:#e9ecf1; --ink-2:#a8b0bd; --ink-3:#79818f;
    --rule:#2a2f38; --rule-2:#3a414d;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
    --good:#5cc98d; --good-bg:#12291d; --warn:#e0ac3a; --warn-bg:#2c2412;
    --crit:#f08a82; --crit-bg:#2e1614;
    --grid:#242932; --tabbar:#1b1f26;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --ground:#0e1013; --surface:#171a1f; --surface-2:#1e222a;
  --ink:#e9ecf1; --ink-2:#a8b0bd; --ink-3:#79818f;
  --rule:#2a2f38; --rule-2:#3a414d;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
  --good:#5cc98d; --good-bg:#12291d; --warn:#e0ac3a; --warn-bg:#2c2412;
  --crit:#f08a82; --crit-bg:#2e1614;
  --grid:#242932; --tabbar:#1b1f26;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--ui);
  font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wb{max-width:1280px;margin:0 auto;padding:18px 16px 0}
.wb-head{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:baseline;
  padding-bottom:14px;border-bottom:1px solid var(--rule-2)}
.wb-title{font-size:19px;font-weight:650;letter-spacing:-.01em;margin:0}
.wb-sub{font-size:12.5px;color:var(--ink-2);margin:0}
.wb-meta{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--ink-3);
  font-variant-numeric:tabular-nums}
/* --- tab strip: one tab per Tableau dashboard --- */
.tabs{display:flex;gap:2px;overflow-x:auto;background:var(--tabbar);
  border:1px solid var(--rule-2);border-top:0;border-radius:0 0 6px 6px;padding:0 4px;
  scrollbar-width:thin}
.tab{flex:0 0 auto;appearance:none;border:0;background:transparent;color:var(--ink-2);
  font-family:var(--ui);font-size:12.5px;font-weight:520;letter-spacing:.005em;
  padding:9px 14px 8px;cursor:pointer;border-bottom:2.5px solid transparent;
  white-space:nowrap}
.tab:hover{color:var(--ink);background:color-mix(in srgb,var(--surface) 55%,transparent)}
.tab[aria-selected="true"]{color:var(--ink);background:var(--surface);
  border-bottom-color:var(--s1);font-weight:640}
.tab:focus-visible{outline:2px solid var(--s1);outline-offset:-2px}
.tab .n{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin-right:6px}
.tab[aria-selected="true"] .n{color:var(--s1)}
/* --- canvas --- */
.canvas{padding:16px 0 26px}
.panel[hidden]{display:none}
.lede{color:var(--ink-2);font-size:13px;max-width:76ch;margin:0 0 14px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(12,1fr)}
.sheet{grid-column:span 12;background:var(--surface);border:1px solid var(--rule);
  border-radius:7px;overflow:hidden;display:flex;flex-direction:column}
.sheet.h6{grid-column:span 6}.sheet.h4{grid-column:span 4}.sheet.h8{grid-column:span 8}
.sheet.h5{grid-column:span 5}.sheet.h7{grid-column:span 7}
@media(max-width:900px){.sheet,.sheet.h6,.sheet.h4,.sheet.h8,.sheet.h5,.sheet.h7{grid-column:span 12}}
.sh-head{padding:9px 13px 8px;border-bottom:1px solid var(--rule);background:var(--surface-2);
  display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.sh-title{font-size:12.5px;font-weight:640;margin:0;letter-spacing:.004em}
.sh-src{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
.sh-note{font-size:11.5px;color:var(--ink-2);padding:0 13px;margin:8px 0 0}
.sh-body{padding:12px 13px 13px;flex:1}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:0 13px 10px;margin:0}
.lg{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-2)}
.lg i{width:10px;height:10px;border-radius:2px;flex:0 0 auto;display:inline-block}
.lg.line i{height:3px;border-radius:2px;width:14px}
/* --- stat tiles --- */
.tiles{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));
  padding:12px 13px 13px}
.tile{background:var(--surface-2);border:1px solid var(--rule);border-radius:6px;padding:10px 11px}
.tile .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);
  display:block;margin-bottom:5px}
.tile .v{font-family:var(--mono);font-size:20px;font-weight:600;color:var(--ink);
  font-variant-numeric:tabular-nums;display:block;line-height:1.15}
.tile .d{font-size:11.5px;color:var(--ink-2);display:block;margin-top:3px}
/* --- tables --- */
.tw{overflow-x:auto;padding:0 13px 13px}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{text-align:left;padding:6px 9px;border-bottom:1px solid var(--rule);white-space:nowrap}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.055em;color:var(--ink-3);
  font-weight:600;background:var(--surface-2);position:sticky;top:0}
td.num{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
tbody tr:hover{background:var(--surface-2)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:640;
  padding:2px 7px;border-radius:99px;letter-spacing:.03em;text-transform:uppercase}
.pill.trig{color:var(--crit);background:var(--crit-bg)}
.pill.ok{color:var(--good);background:var(--good-bg)}
.pill::before{content:"";width:6px;height:6px;border-radius:99px;background:currentColor}
.seg{font-family:var(--mono);font-size:11px;color:var(--ink-2)}
/* --- charts --- */
svg{display:block;width:100%;height:auto;overflow:visible}
.ax{font-family:var(--mono);font-size:9.5px;fill:var(--ink-3)}
.axl{font-size:10px;fill:var(--ink-2)}
.gl{stroke:var(--grid);stroke-width:1}
.dl{font-family:var(--mono);font-size:9.5px;fill:var(--ink-2);font-weight:600}
.hit{fill:transparent;cursor:crosshair}
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--surface);
  border:1px solid var(--rule-2);border-radius:6px;padding:7px 9px;font-size:11.5px;
  box-shadow:0 6px 20px rgba(0,0,0,.16);opacity:0;transition:opacity .09s;max-width:250px}
.tip[data-on="1"]{opacity:1}
.tip b{font-family:var(--mono);font-variant-numeric:tabular-nums}
.tip .r{display:flex;gap:9px;justify-content:space-between;align-items:center}
.tip .r i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:5px}
.tip .h{font-weight:650;margin-bottom:4px;padding-bottom:4px;border-bottom:1px solid var(--rule)}
.cross{stroke:var(--rule-2);stroke-width:1;stroke-dasharray:3 3}
/* --- status bar --- */
.status{border-top:1px solid var(--rule-2);padding:9px 2px 22px;display:flex;
  flex-wrap:wrap;gap:6px 18px;font-family:var(--mono);font-size:11px;color:var(--ink-3);
  font-variant-numeric:tabular-nums}
.status b{color:var(--ink-2);font-weight:600}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wb">

</div>

<script>
const D = window.__DATA__;
const N = (v) => (v === "" || v == null ? null : +v);
const pct = (v, d = 1) => (v == null ? "—" : (v * 100).toFixed(d) + "%");
const num = (v, d = 1) => (v == null ? "—" : v.toFixed(d));
const usd = (v) => (v == null ? "—" : "$" + v.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
const int = (v) => (v == null ? "—" : Math.round(v).toLocaleString("en-US"));
const wk = (s) => s.slice(5).replace("-", "/");
const cssv = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const SER = ["--s1", "--s2", "--s3", "--s4", "--s5"];
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const tip = document.getElementById("tip");

function showTip(html, ev) {
  tip.innerHTML = html;
  tip.dataset.on = "1";
  const r = tip.getBoundingClientRect();
  let x = ev.clientX + 14, y = ev.clientY - 10;
  if (x + r.width > innerWidth - 8) x = ev.clientX - r.width - 14;
  if (y + r.height > innerHeight - 8) y = innerHeight - r.height - 8;
  tip.style.left = x + "px"; tip.style.top = Math.max(8, y) + "px";
}
const hideTip = () => (tip.dataset.on = "0");

function svg(w, h) {
  const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  s.setAttribute("viewBox", `0 0 ${w} ${h}`);
  s.setAttribute("role", "img");
  return s;
}
function el(tag, attrs, parent) {
  const n = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}
// rounded-top bar path, 4px radius, flat on the baseline
function barPath(x, y, w, h, r) {
  r = Math.min(r, w / 2, Math.max(h, 0));
  if (h <= 0.5) return `M${x} ${y + h}h${w}`;
  return `M${x} ${y + h}V${y + r}a${r} ${r} 0 0 1 ${r} ${-r}h${w - 2 * r}a${r} ${r} 0 0 1 ${r} ${r}V${y + h}Z`;
}
function ticks(max, n = 4) {
  const raw = max / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => s >= raw) || mag * 10;
  const out = []; for (let v = 0; v <= max * 1.0001; v += step) out.push(v);
  return out;
}

/* ---------- vertical bars ---------- */
function barChart(host, rows, o) {
  const W = 640, H = o.h || 210, P = { t: 14, r: 10, b: 30, l: 44 };
  const s = svg(W, H); host.appendChild(s);
  const vals = rows.map((r) => o.v(r));
  const max = Math.max(...vals, o.min || 0) * 1.08 || 1;
  const iw = W - P.l - P.r, ih = H - P.t - P.b;
  const bw = iw / rows.length, gap = Math.min(6, bw * 0.22);
  const col = cssv(o.color || "--s1");
  ticks(max).forEach((t) => {
    const y = P.t + ih - (t / max) * ih;
    el("line", { x1: P.l, x2: W - P.r, y1: y, y2: y, class: "gl" }, s);
    el("text", { x: P.l - 7, y: y + 3, class: "ax", "text-anchor": "end" }, s).textContent = o.fmtAx ? o.fmtAx(t) : int(t);
  });
  rows.forEach((r, i) => {
    const v = vals[i], x = P.l + i * bw + gap / 2, w = bw - gap;
    const h = (v / max) * ih, y = P.t + ih - h;
    el("path", { d: barPath(x, y, w, h, 4), fill: col }, s);
    if (o.labelEvery && (i % o.labelEvery === 0 || i === rows.length - 1) && h > 14)
      el("text", { x: x + w / 2, y: y - 4, class: "dl", "text-anchor": "middle" }, s).textContent = o.fmtV(v);
    if (i % (o.tickEvery || 1) === 0 || i === rows.length - 1)
      el("text", { x: x + w / 2, y: H - 10, class: "ax", "text-anchor": "middle" }, s).textContent = o.x(r);
    const hit = el("rect", { x: P.l + i * bw, y: P.t, width: bw, height: ih, class: "hit" }, s);
    hit.addEventListener("pointermove", (e) => showTip(`<div class="h">${esc(o.xFull ? o.xFull(r) : o.x(r))}</div><div class="r"><span><i style="background:${col}"></i>${esc(o.name)}</span><b>${o.fmtV(v)}</b></div>`, e));
    hit.addEventListener("pointerleave", hideTip);
  });
}

/* ---------- multi-series lines, crosshair ---------- */
function lineChart(host, rows, o) {
  const W = 640, H = o.h || 220, P = { t: 14, r: 12, b: 30, l: 46 };
  const s = svg(W, H); host.appendChild(s);
  const iw = W - P.l - P.r, ih = H - P.t - P.b;
  const all = rows.flatMap((r) => o.series.map((se) => o.v(r, se.key))).filter((v) => v != null);
  const max = (o.max != null ? o.max : Math.max(...all)) * 1.08 || 1;
  const min = o.min != null ? o.min : 0;
  const X = (i) => P.l + (rows.length === 1 ? iw / 2 : (i / (rows.length - 1)) * iw);
  const Y = (v) => P.t + ih - ((v - min) / (max - min)) * ih;
  ticks(max).forEach((t) => {
    if (t < min) return;
    const y = Y(t);
    el("line", { x1: P.l, x2: W - P.r, y1: y, y2: y, class: "gl" }, s);
    el("text", { x: P.l - 7, y: y + 3, class: "ax", "text-anchor": "end" }, s).textContent = o.fmtAx ? o.fmtAx(t) : num(t, 0);
  });
  if (o.ref != null) {
    const y = Y(o.ref);
    el("line", { x1: P.l, x2: W - P.r, y1: y, y2: y, stroke: cssv("--ink-3"), "stroke-width": 1, "stroke-dasharray": "5 4" }, s);
    el("text", { x: W - P.r, y: y - 5, class: "dl", "text-anchor": "end" }, s).textContent = o.refLabel || "";
  }
  const cross = el("line", { class: "cross", y1: P.t, y2: P.t + ih, x1: -99, x2: -99 }, s);
  o.series.forEach((se) => {
    const col = cssv(se.color);
    const pts = rows.map((r, i) => [X(i), o.v(r, se.key)]).filter((p) => p[1] != null);
    if (!pts.length) return;
    el("path", { d: pts.map((p, i) => (i ? "L" : "M") + p[0] + " " + Y(p[1])).join(""), fill: "none", stroke: col, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }, s);
    const last = pts[pts.length - 1];
    el("circle", { cx: last[0], cy: Y(last[1]), r: 4.5, fill: col, stroke: cssv("--surface"), "stroke-width": 2 }, s);
    el("text", { x: last[0] + 8, y: Y(last[1]) + 3.5, class: "dl", fill: col }, s).textContent = o.fmtV(last[1]);
  });
  rows.forEach((r, i) => {
    if (i % (o.tickEvery || 1) === 0 || i === rows.length - 1)
      el("text", { x: X(i), y: H - 10, class: "ax", "text-anchor": "middle" }, s).textContent = o.x(r);
  });
  const hit = el("rect", { x: P.l, y: P.t, width: iw, height: ih, class: "hit" }, s);
  hit.addEventListener("pointermove", (e) => {
    const bb = s.getBoundingClientRect();
    const rel = ((e.clientX - bb.left) / bb.width) * W;
    let i = Math.round(((rel - P.l) / iw) * (rows.length - 1));
    i = Math.max(0, Math.min(rows.length - 1, i));
    cross.setAttribute("x1", X(i)); cross.setAttribute("x2", X(i));
    const r = rows[i];
    showTip(`<div class="h">${esc(o.xFull ? o.xFull(r) : o.x(r))}</div>` +
      o.series.map((se) => `<div class="r"><span><i style="background:${cssv(se.color)}"></i>${esc(se.label)}</span><b>${o.fmtV(o.v(r, se.key))}</b></div>`).join(""), e);
  });
  hit.addEventListener("pointerleave", () => { hideTip(); cross.setAttribute("x1", -99); cross.setAttribute("x2", -99); });
}

/* ---------- horizontal bars, ranked ---------- */
function hbar(host, rows, o) {
  const rowH = 21, W = 640, P = { t: 6, r: 56, b: 20, l: 38 };
  const H = P.t + P.b + rows.length * rowH;
  const s = svg(W, H); host.appendChild(s);
  const iw = W - P.l - P.r;
  const max = Math.max(...rows.map(o.v)) * 1.02 || 1;
  if (o.ref != null) {
    const x = P.l + (o.ref / max) * iw;
    el("line", { x1: x, x2: x, y1: P.t, y2: H - P.b, stroke: cssv("--ink-3"), "stroke-width": 1, "stroke-dasharray": "5 4" }, s);
    el("text", { x: x, y: H - 7, class: "ax", "text-anchor": "middle" }, s).textContent = o.refLabel || "";
  }
  rows.forEach((r, i) => {
    const v = o.v(r), y = P.t + i * rowH, h = rowH - 6;
    const w = (v / max) * iw;
    const col = o.color ? cssv(o.color(r, i)) : cssv("--s1");
    el("text", { x: P.l - 8, y: y + h / 2 + 3.5, class: "axl", "text-anchor": "end" }, s).textContent = o.k(r);
    el("rect", { x: P.l, y: y, width: iw, height: h, rx: 3, fill: cssv("--grid") }, s);
    const p = el("path", { d: `M${P.l} ${y}h${Math.max(w - 4, 0)}a4 4 0 0 1 4 4v${h - 8}a4 4 0 0 1 -4 4H${P.l}Z`, fill: col }, s);
    if (w < 8) { p.remove(); el("rect", { x: P.l, y: y, width: Math.max(w, 1.5), height: h, fill: col }, s); }
    el("text", { x: P.l + iw + 8, y: y + h / 2 + 3.5, class: "dl" }, s).textContent = o.fmtV(v);
    const hit = el("rect", { x: 0, y: y - 3, width: W, height: rowH, class: "hit" }, s);
    hit.addEventListener("pointermove", (e) => showTip(`<div class="h">${esc(o.kFull ? o.kFull(r) : o.k(r))}</div>` + o.rows(r).map((t) => `<div class="r"><span>${esc(t[0])}</span><b>${t[1]}</b></div>`).join(""), e));
    hit.addEventListener("pointerleave", hideTip);
  });
}

/* ---------- grouped bars ---------- */
function groupedBar(host, groups, o) {
  const W = 640, H = o.h || 210, P = { t: 14, r: 10, b: 34, l: 50 };
  const s = svg(W, H); host.appendChild(s);
  const iw = W - P.l - P.r, ih = H - P.t - P.b;
  const max = Math.max(...groups.flatMap((g) => o.series.map((se) => g[se.key] ?? 0))) * 1.12 || 1;
  ticks(max).forEach((t) => {
    const y = P.t + ih - (t / max) * ih;
    el("line", { x1: P.l, x2: W - P.r, y1: y, y2: y, class: "gl" }, s);
    el("text", { x: P.l - 7, y: y + 3, class: "ax", "text-anchor": "end" }, s).textContent = o.fmtAx(t);
  });
  const gw = iw / groups.length, inner = Math.min(gw * 0.68, 190);
  const bw = (inner - 2 * (o.series.length - 1)) / o.series.length;
  groups.forEach((g, gi) => {
    const gx = P.l + gi * gw + (gw - inner) / 2;
    o.series.forEach((se, si) => {
      const v = g[se.key] ?? 0, h = (v / max) * ih, y = P.t + ih - h;
      const x = gx + si * (bw + 2), col = cssv(se.color);
      el("path", { d: barPath(x, y, bw, h, 4), fill: col }, s);
      el("text", { x: x + bw / 2, y: y - 5, class: "dl", "text-anchor": "middle" }, s).textContent = o.fmtV(v);
      const hit = el("rect", { x: x, y: P.t, width: bw, height: ih, class: "hit" }, s);
      hit.addEventListener("pointermove", (e) => showTip(`<div class="h">${esc(g.label)}</div><div class="r"><span><i style="background:${col}"></i>${esc(se.label)}</span><b>${o.fmtV(v)}</b></div>`, e));
      hit.addEventListener("pointerleave", hideTip);
    });
    el("text", { x: gx + inner / 2, y: H - 12, class: "axl", "text-anchor": "middle" }, s).textContent = g.label;
  });
}

/* ---------- builders ---------- */
function sheet(span, title, src, bodyFn, note, legend) {
  const d = document.createElement("div");
  d.className = "sheet " + span;
  d.innerHTML = `<div class="sh-head"><h3 class="sh-title">${esc(title)}</h3><span class="sh-src">${esc(src)}</span></div>` +
    (note ? `<p class="sh-note">${note}</p>` : "") +
    (legend ? `<div class="legend">${legend.map((l) => `<span class="lg ${l.line ? "line" : ""}"><i style="background:${cssv(l.color)}"></i>${esc(l.label)}</span>`).join("")}</div>` : "");
  const b = document.createElement("div");
  b.className = "sh-body";
  d.appendChild(b);
  bodyFn(b);
  return d;
}
function tiles(span, title, src, items, note) {
  const d = document.createElement("div");
  d.className = "sheet " + span;
  d.innerHTML = `<div class="sh-head"><h3 class="sh-title">${esc(title)}</h3><span class="sh-src">${esc(src)}</span></div>` +
    (note ? `<p class="sh-note">${note}</p>` : "") +
    `<div class="tiles">${items.map((i) => `<div class="tile"><span class="k">${esc(i.k)}</span><span class="v">${i.v}</span><span class="d">${esc(i.d)}</span></div>`).join("")}</div>`;
  return d;
}
function table(span, title, src, cols, rows, note) {
  const d = document.createElement("div");
  d.className = "sheet " + span;
  d.innerHTML = `<div class="sh-head"><h3 class="sh-title">${esc(title)}</h3><span class="sh-src">${esc(src)}</span></div>` +
    (note ? `<p class="sh-note">${note}</p>` : "") +
    `<div class="tw"><table><thead><tr>${cols.map((c) => `<th${c.num ? ' style="text-align:right"' : ""}>${esc(c.h)}</th>`).join("")}</tr></thead>` +
    `<tbody>${rows.map((r) => `<tr>${r.map((c, i) => `<td class="${cols[i].num ? "num" : ""}">${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  return d;
}

        DC.map((r) => [nice(r.account__damage_class), int(N(r.at_risk_accounts)), usd(N(r.recoverable_mrr_usd)),
          r.account__damage_class === "system_inflicted" ? "A delivery defect the company owns — call these first."
            : r.account__damage_class === "self_selected" ? "Short-tenure accounts with no delivery defect. Only 11 of them: tenure does not discriminate in this data, which is itself the finding."
              : "Neither signal is decisive. Treat as a two-bucket queue in practice."]),
        "The three-way split is reported honestly rather than presented as actionable: <b>self-selected is 11 accounts</b>, and mean tenure is 661.7 days in system-inflicted against 669.0 in ambiguous."));
    },
  },

  /* ================= 7. DECISION CONTRACT ================= */
  {
    id: "contract", name: "Decision Contract",
    lede: "Every published metric with a threshold set before the value was observed, the segment that value came from, and the action its owner takes when it fires. This is the sheet that makes the analysis falsifiable.",
    build(c) {
      const C = D.decision_contract;
      const trig = C.filter((r) => r.status === "triggered");
      const byOwner = {};
      trig.forEach((r) => { byOwner[r.owner] = (byOwner[r.owner] || 0) + 1; });
      c.appendChild(tiles("h12", "Contract state", "control_decision_contract.csv", [
        { k: "Metrics under contract", v: int(C.length), d: "each with a declared consequence" },
        { k: "Triggered", v: int(trig.length), d: "threshold breached" },
        { k: "Within tolerance", v: int(C.length - trig.length), d: "no action required" },
        { k: "Owners with actions", v: int(Object.keys(byOwner).length), d: Object.entries(byOwner).sort((a, b) => b[1] - a[1]).map((e) => e[0] + " " + e[1]).join(" · ") },
      ]));
      const q = { growing: "Is it growing?", staying: "Are they staying?", valuable: "Is it valuable?", efficient: "Is it efficient?" };
      ["growing", "staying", "valuable", "efficient"].forEach((k) => {
        const rows = C.filter((r) => r.decision_question === k)
          .sort((a, b) => (a.status === b.status ? a.metric_name.localeCompare(b.metric_name) : a.status === "triggered" ? -1 : 1));
        c.appendChild(table("h12", q[k], "control_decision_contract.csv",
          [{ h: "Metric" }, { h: "Value", num: 1 }, { h: "Segment" }, { h: "Threshold", num: 1 }, { h: "Status" }, { h: "Action if triggered" }, { h: "Owner" }],
          rows.map((r) => {
            const v = N(r.current_value);
            const t = N(r.threshold_value);
            const small = t != null && Math.abs(t) <= 1.5;
            const f = (x) => (x == null ? "—" : small ? num(x, 3) : num(x, 2));
            const dir = { below: "below", above: "above", at_or_above: "at or above" }[r.threshold_direction] || r.threshold_direction;
            return [`<code>${esc(r.metric_name)}</code>`, f(v), r.segment ? `<span class="seg">${esc(r.segment)}</span>` : "<span class=\"seg\">—</span>",
              `${dir} ${f(t)}`,
              `<span class="pill ${r.status === "triggered" ? "trig" : "ok"}">${r.status === "triggered" ? "triggered" : "ok"}</span>`,
              esc(r.action), esc(r.owner)];
          })));
      });
    },
  },
];

const tabsEl = document.getElementById("tabs"), canvas = document.getElementById("canvas");
TABS.forEach((t, i) => {
  const b = document.createElement("button");
  b.className = "tab"; b.type = "button"; b.role = "tab"; b.id = "tab-" + t.id;
  b.setAttribute("aria-selected", i === 0 ? "true" : "false");
  b.setAttribute("aria-controls", "p-" + t.id);
  b.innerHTML = `<span class="n">${i + 1}</span>${esc(t.name)}`;
  b.addEventListener("click", () => select(i));
  tabsEl.appendChild(b);
  const p = document.createElement("section");
  p.className = "panel"; p.id = "p-" + t.id; p.role = "tabpanel";
  p.setAttribute("aria-labelledby", "tab-" + t.id);
  if (i !== 0) p.hidden = true;
  p.innerHTML = `<p class="lede">${t.lede}</p>`;
  const g = document.createElement("div"); g.className = "grid";
  p.appendChild(g); t.build(g);
  canvas.appendChild(p);
});
function select(i) {
  [...tabsEl.children].forEach((b, j) => b.setAttribute("aria-selected", i === j ? "true" : "false"));
  [...canvas.children].forEach((p, j) => (p.hidden = i !== j));
  hideTip();
  window.scrollTo({ top: 0, behavior: matchMedia("(prefers-reduced-motion:reduce)").matches ? "auto" : "smooth" });
}
tabsEl.addEventListener("keydown", (e) => {
  const i = [...tabsEl.children].findIndex((b) => b.getAttribute("aria-selected") === "true");
  if (e.key === "ArrowRight") { select((i + 1) % TABS.length); tabsEl.children[(i + 1) % TABS.length].focus(); }
  if (e.key === "ArrowLeft") { const n = (i - 1 + TABS.length) % TABS.length; select(n); tabsEl.children[n].focus(); }
});
const nRows = Object.values(D).reduce((s, r) => s + r.length, 0);
document.getElementById("meta").textContent = `50 metrics · 25 extracts · ${nRows} rows`;
document.getElementById("status").innerHTML =

  `<span><b>Window</b> 2026-01-05 → 2026-05-03</span>` +
  `<span><b>Grain</b> as exported; no re-aggregation in this page</span>`;

</script>
