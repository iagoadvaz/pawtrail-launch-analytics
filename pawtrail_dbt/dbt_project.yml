name: 'pawtrail'
version: '1.0.0'
config-version: 2

profile: 'pawtrail'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Activation thresholds live here rather than being repeated as literals inside
# model SQL, so the SLA the funnel enforces, the metric definitions, and
# METRICS.md can never drift apart.
vars:
  kit_sla_days: 10
  digital_activation_window_days: 7
  at_risk_no_login_days: 14
  # Spec §6 calls for combined activation at 7/14/30 days. 7 reuses
  # digital_activation_window_days and 30 is the North Star window below; only
  # the 14-day point needs its own var. It is kept separate from
  # at_risk_no_login_days, which happens to share the value 14 but answers a
  # different question — tying them together would mean retuning the risk queue
  # every time the activation window moved.
  combined_activation_mid_window_days: 14
  combined_activation_window_days: 30
  # Must equal FIRST_CYCLE_TASK_COUNT in the generator (Task 4). It is the
  # denominator of the task-completion rate, so a silent drift would not error —
  # it would just report a wrong percentage. Task 7 adds a singular test that
  # fails if any account completed more tasks than this allows.
  first_cycle_task_count: 8
  # The launch attach-rate target the dashboard and memo judge performance
  # against (spec §6, "Attach rate ... vs. launch target"). 15% sits inside the
  # 10-30% band the spec's own reference on add-on attach rates cites as typical,
  # so the comparison reads as a plausible goal rather than a number invented to
  # flatter the result. It lives here, not in a Tableau constant, so the target
  # on the chart and the target quoted in NARRATIVE.md cannot disagree.
  attach_rate_launch_target: 0.15
  # Mirrors NON_ACTIVATED_CHURN_MULTIPLIER in
  # generator/generate_subscription_lifecycle.py. It exists so the recovery test
  # reads the value from one source -- a silent drift between generator and test
  # would make the test pass while validating the wrong number.
  planted_non_activated_churn_multiplier: 2.0
  # Market benchmark cited by Crystallize (spec §1.6). It lives here rather than
  # in a dashboard constant for the same reason as attach_rate_launch_target: the
  # target on the chart and the target quoted in the memo cannot disagree.
  activation_rate_benchmark: 0.70
  # Tenure below which a never-logged-in account with no delivery defect reads
  # as self-selected rather than as damage the company inflicted. Calibrated
  # against the observed tenure distribution, NOT taken from a rule of thumb --
  # see the comment in fct_at_risk_accounts.sql.
  self_selected_tenure_days: 365
  # The subscription's billing interval. PawTrail is monthly; the var exists so
  # that the cycle clock and the unit economics read the same cadence from one
  # source, and so that a scenario test (quarterly) is a one-line change rather
  # than a find-and-replace across SQL.
  billing_cycle_months: 1
  # Ceiling of the cycle spine. The simulated window is 120 days, so no account
  # can have more than 4 monthly renewals come due. It doubles as a guard: if the
  # window grows and this var does not, the model silently stops counting cycles
  # -- which is why Task 1 ships a check that fails if any account hits the
  # ceiling.
  max_billing_cycles: 4

models:
  pawtrail:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
