version: 2

models:
  - name: int_activation_funnel
    columns:
      - name: account_id
        tests:
          - unique
          - not_null
      - name: digital_activated_7d
        tests:
          - not_null
      - name: kit_activated_sla
        tests:
          - not_null
      - name: combined_activated_30d
        tests:
          - not_null
      - name: days_observed
        tests:
          - not_null
      - name: is_mature_30d
        tests:
          - not_null

  - name: int_billing_cycles
    columns:
      - name: billing_cycle_key
        tests:
          - unique
          - not_null
      - name: account_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_subscriptions')
                field: account_id
      - name: cycle_index
        tests:
          - not_null
      - name: renewal_due_date
        tests:
          - not_null

  - name: int_subscription_state
    columns:
      - name: subscription_state_key
        tests:
          - unique
          - not_null
      - name: state
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['active', 'skipped', 'paused', 'canceled']
      - name: is_retained
        tests:
          - not_null
      - name: churned_this_cycle
        tests:
          - not_null
      - name: at_risk_this_cycle
        tests:
          - not_null
      - name: pet_tier_at_cycle
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['small', 'medium', 'large']
