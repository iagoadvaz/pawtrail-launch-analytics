semantic_models:
  - name: accounts
    model: ref('dim_accounts')
    entities:
      - name: account
        type: primary
        expr: account_id
    dimensions:
      - name: state
        type: categorical
      - name: pet_tier
        type: categorical
      - name: channel
        type: categorical
      # Completes spec §6's segmentation set (state, pet tier, channel, Premium
      # tenure before attach). The banded column is exposed rather than the raw
      # day count so `--group-by account__premium_tenure_band` returns four
      # comparable cohorts instead of one row per distinct tenure value.
      - name: premium_tenure_band
        type: categorical
      - name: cycle_exposure_cohort
        type: categorical
      # REQUIRED, not optional. `accounts` has never carried a measure before,
      # so it has no time dimension and no `defaults` block. Attaching the
      # measures below without this pair makes `dbt parse` fail with
      # "Aggregation time dimension for measure renewal_exposed_accounts is not
      # set!", which gates dbt build and stops every pre-existing test running.
      #
      # The name is qualified because the `subscriptions` semantic model already
      # owns the bare `signup_date`; this matches the convention already used by
      # activation_signup_date, kit_signup_date and at_risk_signup_date.
      - name: accounts_signup_date
        type: time
        expr: pawtrail_signup_date
        type_params:
          time_granularity: day
    defaults:
      agg_time_dimension: accounts_signup_date
    measures:
      # Accounts that have already faced at least one due renewal. This is NOT a
      # billing measure: it counts how many accounts had the *opportunity* to
      # renew inside the observed window. See the header of
      # int_billing_cycles.sql.
      - name: renewal_exposed_accounts
        agg: sum
        expr: case when has_faced_renewal then 1 else 0 end
        create_metric: true
      - name: renewal_unexposed_accounts
        agg: sum
        expr: case when has_faced_renewal then 0 else 1 end
        create_metric: true
      - name: assessable_base_accounts
        agg: count
        expr: account_id
        create_metric: true

  - name: subscriptions
    model: ref('fct_subscriptions')
    defaults:
      agg_time_dimension: signup_date
    entities:
      - name: account
        type: primary
        expr: account_id
    dimensions:
      - name: signup_date
        type: time
        expr: pawtrail_signup_date
        type_params:
          time_granularity: day
    measures:
      - name: subscription_count
        agg: count
        expr: account_id
      # Conversion lag (spec §6): average days from becoming Premium to attaching.
      - name: avg_conversion_lag_days
        agg: average
        expr: conversion_lag_days

  - name: activation_events
    model: ref('fct_activation_events')
    defaults:
      agg_time_dimension: activation_signup_date
    entities:
      - name: account
        type: primary
        expr: account_id
    dimensions:
      # Named uniquely per model rather than `signup_date`: MetricFlow forbids
      # the same (primary entity, dimension name) pair on more than one
      # semantic model, and `subscriptions` already owns the bare name. Every
      # query in this plan reaches time via the universal `metric_time`
      # alias, never this model-qualified name directly, so the rename has no
      # downstream impact.
      - name: activation_signup_date
        type: time
        expr: pawtrail_signup_date
        type_params:
          time_granularity: day
    # Numerator and denominator are both restricted to the cohort that has had
    # the full window. Counting an account that signed up four days ago as a
    # failed 30-day activation is the classic launch-analytics error: it drags
    # the North Star down hardest in the most recent weeks, which are exactly
    # the weeks a launch dashboard is read for.
    measures:
      # Accounts that never logged in at all, within the mature cohort. The
      # numerator of the censored share; see METRICS.md on why the mean
      # time-to-login cannot see these accounts.
      - name: never_logged_in_accounts
        agg: sum
        # days_to_first_login, not first_login_date: fct_activation_events
        # carries the interval, not the date, and it is null exactly when the
        # account never logged in. A measure naming a column the mart does not
        # select builds green under dbt and fails only at mf query time.
        expr: case when days_to_first_login is null and is_mature_30d then 1 else 0 end
        create_metric: true
      # `create_metric: true` on the measures below: MetricFlow/dbt-core (this
      # project's pinned dbt-core 1.11.13) resolves a `ratio` metric's
      # numerator/denominator as references to other *metrics*, not to bare
      # measures — `dbt parse` fails with "The metric `X` does not exist" if a
      # ratio in _metrics.yml points at a measure with no same-named metric.
      # `create_metric: true` auto-registers a same-named simple proxy metric
      # for the measure so those ratio metrics resolve. Verified empirically
      # via `dbt parse` (Task 15); only added where no metric of the same name
      # already exists in _metrics.yml.
      - name: mature_accounts_7d
        agg: sum
        expr: case when is_mature_7d then 1 else 0 end
        create_metric: true
      - name: mature_accounts_sla
        agg: sum
        expr: case when is_mature_sla then 1 else 0 end
        create_metric: true
      - name: mature_accounts_30d
        agg: sum
        expr: case when is_mature_30d then 1 else 0 end
        create_metric: true
      # Combined rates use their own maturity flags, which are the later of the
      # digital window and the kit SLA. Pairing combined_activated_7d with
      # mature_accounts_7d instead would count accounts whose SLA window is still
      # open as combined-activation failures.
      - name: mature_accounts_combined_7d
        agg: sum
        expr: case when is_mature_combined_7d then 1 else 0 end
        create_metric: true
      - name: mature_accounts_combined_14d
        agg: sum
        expr: case when is_mature_combined_14d then 1 else 0 end
        create_metric: true
      - name: digitally_activated_accounts
        agg: sum
        expr: case when digital_activated_7d and is_mature_7d then 1 else 0 end
        create_metric: true
      - name: kit_activated_accounts
        agg: sum
        expr: case when kit_activated_sla and is_mature_sla then 1 else 0 end
        create_metric: true
      - name: combined_activated_accounts_7d
        agg: sum
        expr: case when combined_activated_7d and is_mature_combined_7d then 1 else 0 end
        create_metric: true
      - name: combined_activated_accounts_14d
        agg: sum
        expr: case when combined_activated_14d and is_mature_combined_14d then 1 else 0 end
        create_metric: true
      - name: combined_activated_accounts_30d
        agg: sum
        expr: case when combined_activated_30d and is_mature_30d then 1 else 0 end
        create_metric: true
      # Early risk counts (spec §6). Both are restricted to accounts old enough
      # to be judged, for the same reason the activation rates are.
      # Gated on is_mature_no_login_14d, which follows at_risk_no_login_days --
      # the same var the flag itself uses. is_mature_combined_14d was the wrong
      # gate for a purely digital question: it is the later of the 14-day
      # activation window and the *kit* SLA, so a change to kit_sla_days would
      # silently move the population of a metric that never asks about kits.
      # Both currently resolve to 14 days, so this changes no number today; it
      # stops the agreement from being a coincidence.
      - name: zero_digital_access_accounts
        agg: sum
        expr: case when no_digital_access_14d and is_mature_no_login_14d then 1 else 0 end
      - name: zero_task_accounts
        agg: sum
        expr: >-
          case when coalesce(care_tasks_completed_first_cycle, 0) = 0
               and is_mature_30d then 1 else 0 end
      # Time-to-milestone averages (spec §6, activation). Null for accounts that
      # never logged in or never received a kit, and avg skips nulls, so these
      # read as "how fast for those who got there" rather than being dragged
      # toward zero by accounts that never arrived.
      #
      # Both are gated on the 30-day cohort for the same reason every activation
      # rate is, and the gate matters more here than it looks. An account five
      # days old can only contribute a value of five or less: its slow outcomes
      # have not happened yet and enter the average as nulls, so the newest weeks
      # report only their fastest cases and read faster than they are. The paired
      # `<= 30` bound is what makes the gate sufficient — with a full 30-day
      # window and a 30-day cap, no counted event can postdate the observation
      # date, which is how 36 kit deliveries and 25 logins dated past the cutoff
      # were reaching these averages. The cap costs almost nothing: 12 kits in
      # the whole dataset arrive later than day 30. A tighter 14-day bound was
      # tried and rejected — it truncates 148 genuinely late kits and pulls the
      # average from 6.4 to 5.6, trading a small bias for a larger one.
      - name: avg_days_to_first_login
        agg: average
        expr: >-
          case when is_mature_30d
                    and days_to_first_login
                        <= {{ var('combined_activation_window_days') }}
               then days_to_first_login end
      - name: avg_days_to_kit_delivery
        agg: average
        expr: >-
          case when is_mature_30d
                    and days_to_kit_delivery
                        <= {{ var('combined_activation_window_days') }}
               then days_to_kit_delivery end
      # First-cycle task engagement (spec §6, early engagement). Two different
      # questions: `tasks_completed` over `tasks_available` is how much of the
      # care plan got done, while `task_engaged_accounts` over the mature cohort
      # is how many people started at all. A launch can score well on the second
      # and badly on the first, which is the interesting case.
      - name: tasks_completed
        agg: sum
        expr: >-
          case when is_mature_30d
               then coalesce(care_tasks_completed_first_cycle, 0) else 0 end
        create_metric: true
      - name: tasks_available
        agg: sum
        expr: >-
          case when is_mature_30d
               then {{ var('first_cycle_task_count') }} else 0 end
        create_metric: true
      - name: task_engaged_accounts
        agg: sum
        expr: >-
          case when coalesce(care_tasks_completed_first_cycle, 0) >= 1
               and is_mature_30d then 1 else 0 end
        create_metric: true

  - name: kit_deliveries
    model: ref('fct_kit_deliveries')
    # Measures need an aggregation time dimension for MetricFlow to validate and
    # for metric_time to resolve. Signup date is used rather than delivery date:
    # delivery date is null for lost kits, which are exactly the rows the lost
    # rate must not drop.
    defaults:
      agg_time_dimension: kit_signup_date
    entities:
      - name: account
        type: primary
        expr: account_id
    dimensions:
      # Named uniquely per model (see the note above `activation_events`) —
      # `subscriptions` owns the bare `signup_date` name.
      - name: kit_signup_date
        type: time
        expr: pawtrail_signup_date
        type_params:
          time_granularity: day
      # No local `state` dimension: `accounts` already owns it under the same
      # `account` primary entity (see the note above `activation_events`).
      # Query kit-delivery metrics grouped by `account__state` — same values
      # (`fct_kit_deliveries.state` is itself sourced from `dim_accounts` via
      # a join in Task 10), one owner, reached through the shared entity.
    measures:
      # `kits_shipped` counts every account with a kit obligation, including
      # lost ones. The earlier name `kits_delivered` was misleading: it was used
      # as the denominator of the on-time rate while actually counting kits that
      # never arrived, so "on-time delivery rate" and "lost rate" were quietly
      # measured against different populations than their names implied.
      - name: kits_shipped
        agg: sum
        expr: case when is_mature_sla then 1 else 0 end
        create_metric: true
      - name: kits_on_time
        agg: sum
        expr: case when kit_activated_sla and is_mature_sla then 1 else 0 end
        create_metric: true
      - name: kits_lost
        agg: sum
        expr: case when kit_lost and is_mature_sla then 1 else 0 end
        create_metric: true
      # Delay distribution (spec §6, kit operations). days_late is null for
      # on-time and lost kits, and `average` skips nulls, so this answers "when
      # a kit is late, how late" rather than diluting the figure with the
      # on-time majority. It is also null for a kit that is late but had not
      # arrived by the observation date: that delay has not been observed, so it
      # cannot be averaged. The figure is therefore censored, and reads slightly
      # low against the eventual truth -- 5.82 days here against 5.95 if the
      # unobserved deliveries are counted at their future duration.
      - name: avg_days_late
        agg: average
        expr: days_late
      # Counted from kit_late_sla, not from `days_late is not null`. The two
      # agree on this seed, but only the former is answerable at the cutoff: a
      # kit whose SLA has expired is late whether or not it has arrived, and
      # deriving the count from a delivery-date arithmetic made 6 of the 373
      # depend on a delivery dated after the observation date.
      - name: kits_late
        agg: sum
        expr: case when kit_late_sla then 1 else 0 end
        create_metric: true

  - name: weekly_attach
    model: ref('fct_weekly_attach')
    defaults:
      agg_time_dimension: signup_week
    entities:
      # Surrogate key, not `state`: the grain is (state, week), so `state` alone
      # is not unique and declaring it primary is a false uniqueness claim that
      # can fan out joins.
      - name: weekly_attach_row
        type: primary
        expr: weekly_attach_key
    dimensions:
      - name: state
        type: categorical
      - name: signup_week
        type: time
        type_params:
          time_granularity: week
    # Both measures are semi-additive: they sum correctly ACROSS states within a
    # week, but not across weeks (cumulative_subscriptions would double-count and
    # eligible_premium_accounts would be multiplied by the number of weeks).
    # `agg: max` was wrong here: grouped by week it silently returns the largest
    # state's cumulative over the largest state's base — i.e. SP's attach rate
    # mislabelled as the national trend.
    #
    # `non_additive_dimension` is what makes `agg: sum` safe. It tells MetricFlow
    # that these columns are snapshots on signup_week: for whatever window a
    # query covers, read each row at the LATEST week in that window and sum those
    # across states, rather than summing every week's snapshot together. Without
    # it, an ungrouped query answers with seventeen weeks of a 15,000-account
    # base added up — 255,000 — and reports the launch at 0.699x its target when
    # it finished at 1.33x. Nothing about that answer looks wrong on the page,
    # which is why a comment warning readers off the query was never enough:
    # METRICS.md invites a bare `mf query` for every metric, and the Phase 3
    # decision contract issues exactly that query unattended.
    #
    # Grouping by signup_week is unaffected — each week is then its own window,
    # which is the launch-pulse chart and was always correct. Grouping by state
    # alone now works too, and is no longer forbidden: each state is read at the
    # final week, so the parts sum to 3,000 over 15,000. semantic_tests/
    # test_attach_rate_grains.py asserts all three groupings.
    measures:
      # `create_metric: true` on cumulative_subscriptions only: attach_rate's
      # numerator references this measure directly and no metric of the same
      # name exists (see the note above activation_events' measures).
      # eligible_premium_accounts needs no flag — a simple metric already
      # shares its exact name.
      - name: cumulative_subscriptions
        agg: sum
        expr: cumulative_subscriptions
        create_metric: true
        non_additive_dimension:
          name: signup_week
          window_choice: max
      - name: eligible_premium_accounts
        agg: sum
        expr: eligible_premium_accounts
        non_additive_dimension:
          name: signup_week
          window_choice: max

  - name: weekly_channel_economics
    model: ref('fct_weekly_channel_economics')
    defaults:
      agg_time_dimension: signup_week
    entities:
      # Surrogate key for the same reason as weekly_attach: the grain is
      # (channel, week), so `channel` alone is not unique.
      - name: channel_week_row
        type: primary
        expr: channel_week_key
    dimensions:
      - name: channel
        type: categorical
      - name: signup_week
        type: time
        type_params:
          time_granularity: week
    measures:
      - name: channel_new_subscriptions
        agg: sum
        expr: new_subscriptions
        create_metric: true
      - name: channel_activated_subscriptions
        agg: sum
        expr: activated_subscriptions
        create_metric: true
      - name: channel_spend_usd
        agg: sum
        expr: spend_usd
        create_metric: true
      # The cost_per_activated_account pair. Both sides are restricted to the
      # weeks that have any mature account, so the ratio compares like with
      # like at every grain: summing an estimate that is null for still-green
      # weeks against a spend total that is not would reintroduce, on roll-up,
      # exactly the censoring the estimate exists to remove. `channel_spend_usd`
      # is deliberately not reused as the numerator for that reason.
      - name: channel_activation_measurable_spend_usd
        agg: sum
        expr: activation_measurable_spend_usd
        create_metric: true
      - name: channel_estimated_activated_subscriptions
        agg: sum
        expr: estimated_activated_subscriptions
        create_metric: true
      # Backs both cac_payback_months and contribution_margin_per_subscription.
      # Neither is an `average` measure over an already-averaged column: at this
      # model's (channel, week) grain such a measure is a no-op, but the moment
      # the semantic layer groups more coarsely it weights every week equally
      # regardless of how many subscriptions the week actually carried, and a
      # launch's earliest weeks are both its smallest and its most extreme.
      - name: channel_total_contribution_margin_usd
        agg: sum
        expr: total_contribution_margin_usd
        create_metric: true
      # Incremental MRR sums across channels and weeks, so unlike attach rate it
      # is safe to group by either or neither.
      - name: mrr_added_usd
        agg: sum
        expr: mrr_usd
        create_metric: true

  - name: sales_pitches
    model: ref('fct_sales_pitches')
    defaults:
      agg_time_dimension: pitch_date
    entities:
      - name: pitch
        type: primary
        expr: pitch_id
    dimensions:
      - name: pitch_date
        type: time
        type_params:
          time_granularity: day
      - name: state
        type: categorical
    measures:
      - name: pitches_total
        agg: count
        expr: pitch_id
        create_metric: true
      - name: pitches_won
        agg: sum
        expr: case when won then 1 else 0 end
        create_metric: true

  - name: at_risk_accounts
    model: ref('fct_at_risk_accounts')
    defaults:
      agg_time_dimension: at_risk_signup_date
    entities:
      - name: account
        type: primary
        expr: account_id
    dimensions:
      # Named uniquely per model (see the note above `activation_events`).
      - name: at_risk_signup_date
        type: time
        expr: pawtrail_signup_date
        type_params:
          time_granularity: day
      # No local `state`/`channel`: `accounts` already owns both under the
      # same `account` primary entity. Group by `account__state` /
      # `account__channel` instead if a by-state or by-channel cut of the
      # at-risk queue is ever needed — this plan's own queries only ever
      # group this model by `account__risk_driver`.
      - name: risk_driver
        type: categorical
      - name: damage_class
        type: categorical
    measures:
      - name: system_inflicted_at_risk_accounts
        agg: sum
        expr: case when is_at_risk and damage_class = 'system_inflicted' then 1 else 0 end
        create_metric: true
      - name: recoverable_mrr_usd
        agg: sum
        expr: recoverable_mrr_usd
        create_metric: true
      - name: assessable_accounts
        agg: count
        expr: account_id
        create_metric: true
      - name: at_risk_accounts_count
        agg: sum
        expr: case when is_at_risk then 1 else 0 end
        create_metric: true

  - name: subscription_unit_economics
    model: ref('fct_subscription_unit_economics')
    defaults:
      agg_time_dimension: unit_economics_signup_week
    entities:
      - name: account
        type: primary
        expr: account_id
    dimensions:
      # Model-qualified name: MetricFlow forbids the same (primary entity,
      # dimension name) pair on more than one semantic model, and `subscriptions`
      # already owns `signup_date`. Same reason as the rename in
      # activation_events.
      - name: unit_economics_signup_week
        type: time
        expr: signup_week
        type_params:
          time_granularity: week
    measures:
      - name: breakeven_cycles_sum
        agg: sum
        expr: breakeven_cycles
        create_metric: true
      - name: unit_economics_accounts
        agg: count
        expr: account_id
        create_metric: true
      - name: total_cost_to_recover_usd
        agg: sum
        expr: total_cost_to_recover_usd
        create_metric: true
      - name: cycle_margin_usd
        agg: sum
        expr: contribution_margin_per_cycle
        create_metric: true
      - name: accounts_breakeven_within_window
        agg: sum
        expr: case when breakeven_within_window then 1 else 0 end
        create_metric: true

  - name: weekly_channel_effective_cac
    model: ref('fct_weekly_channel_effective_cac')
    defaults:
      agg_time_dimension: effective_cac_signup_week
    entities:
      - name: effective_cac_row
        type: primary
        expr: effective_cac_key
    dimensions:
      - name: effective_cac_signup_week
        type: time
        expr: signup_week
        type_params:
          time_granularity: week
      - name: channel
        type: categorical
    measures:
      - name: loaded_spend_usd
        agg: sum
        expr: loaded_spend_usd
        create_metric: true
      - name: fulfillment_waste_usd
        agg: sum
        expr: wasted_fulfillment_usd
        create_metric: true
      - name: effective_cac_new_subscriptions
        agg: sum
        expr: new_subscriptions
        create_metric: true
      - name: nominal_spend_usd
        agg: sum
        expr: spend_usd
        create_metric: true

  - name: state_saturation
    model: ref('fct_state_saturation')
    entities:
      - name: saturation_state
        type: primary
        expr: state
    dimensions:
      - name: state
        type: categorical
      # Same MetricFlow requirement as the `accounts` model in Task 3: measures
      # need an agg_time_dimension or `dbt parse` fails. fct_state_saturation is
      # a single snapshot at the final week, so the model carries `snapshot_date`
      # (see its final select) and it is declared here. Both halves are load
      # bearing: declaring the dimension without producing the column builds
      # green under dbt and fails only at `mf validate-configs`.
      - name: snapshot_date
        type: time
        expr: snapshot_date
        type_params:
          time_granularity: day
    defaults:
      agg_time_dimension: snapshot_date
    measures:
      - name: remaining_eligible_accounts
        agg: sum
        expr: remaining_eligible_accounts
        create_metric: true
      - name: state_cycle_margin_usd
        agg: sum
        expr: cycle_margin_usd
        create_metric: true
      - name: saturation_cumulative_subscriptions
        agg: sum
        expr: cumulative_subscriptions
        create_metric: true
      - name: saturation_eligible_accounts
        agg: sum
        expr: eligible_premium_accounts
        create_metric: true

  - name: subscription_lifecycle
    model: ref('fct_subscription_lifecycle')
    defaults:
      agg_time_dimension: cycle_due_date
    entities:
      - name: lifecycle_row
        type: primary
        expr: subscription_state_key
      - name: account
        type: foreign
        expr: account_id
    dimensions:
      - name: cycle_due_date
        type: time
        expr: renewal_due_date
        type_params:
          time_granularity: day
      - name: cycle_index
        type: categorical
      - name: subscription_state
        type: categorical
        expr: state
    measures:
      - name: cycle_one_accounts
        agg: sum
        expr: case when is_cycle_one then 1 else 0 end
        create_metric: true
      - name: cycle_one_rebilled_accounts
        agg: sum
        expr: case when rebilled_at_cycle_one then 1 else 0 end
        create_metric: true
      - name: retained_accounts
        agg: sum
        expr: case when is_retained then 1 else 0 end
        create_metric: true
      - name: churned_accounts
        agg: sum
        expr: case when churned_this_cycle then 1 else 0 end
        create_metric: true
      - name: at_risk_accounts_this_cycle
        agg: sum
        expr: case when at_risk_this_cycle then 1 else 0 end
        create_metric: true
      - name: cycle_rows
        agg: count
        expr: subscription_state_key
        create_metric: true
      # Denominator for skip_rate and pause_rate. NOT cycle_rows: cycle 0 is the
      # initial purchase, where skipping and pausing are impossible by
      # construction -- 3,000 rows, zero of each. Dividing by every account-cycle
      # puts a population that had no opportunity into the denominator and
      # understates the rate by 41% (skip 0.0554 -> 0.0328).
      - name: renewal_cycle_rows
        agg: sum
        expr: case when cycle_index > 0 then 1 else 0 end
        create_metric: true
      - name: skipped_cycles
        agg: sum
        expr: case when state = 'skipped' then 1 else 0 end
        create_metric: true
      - name: paused_cycles
        agg: sum
        expr: case when state = 'paused' then 1 else 0 end
        create_metric: true
      - name: cycle_mrr_usd
        agg: sum
        expr: cycle_mrr_usd
        create_metric: true

  - name: mrr_movement
    model: ref('fct_mrr_movement')
    entities:
      - name: mrr_movement_cycle
        type: primary
        expr: mrr_movement_key
    dimensions:
      - name: movement_cycle_index
        type: categorical
        expr: cycle_index
      # REQUIRED. MetricFlow demands an agg_time_dimension for every measure,
      # and this model has five. Without it `dbt parse` fails with
      # "Aggregation time dimension for measure starting_mrr_usd is not set!" --
      # a parse error, which gates dbt build and stops every Phase 1 test
      # running too. Every other semantic model in this project that carries
      # measures declares one.
      #
      # fct_mrr_movement is aggregated to cycle_index alone, which spans ~120
      # distinct due dates, so the mart must also be regrained to
      # (cycle_index, cycle_due_week) and carry that column. Regraining is the
      # better fix regardless: it is what lets the movement bridge be read as a
      # time series rather than as four opaque buckets.
      - name: cycle_due_week
        type: time
        expr: cycle_due_week
        type_params:
          time_granularity: week
    defaults:
      agg_time_dimension: cycle_due_week
    measures:
      - name: starting_mrr_usd
        agg: sum
        expr: starting_mrr_usd
        create_metric: true
      - name: ending_mrr_usd
        agg: sum
        expr: ending_mrr_usd
        create_metric: true
      - name: expansion_mrr_usd
        agg: sum
        expr: expansion_mrr_usd
        create_metric: true
      - name: contraction_mrr_usd
        agg: sum
        expr: contraction_mrr_usd
        create_metric: true
      - name: churned_mrr_usd
        agg: sum
        expr: churned_mrr_usd
        create_metric: true
      # Beside the bridge, not inside it: revenue a live subscription did not
      # bill this cycle because it skipped or paused. Publishing it on its own
      # line is what lets contraction mean "a tier went down" and nothing else.
      # No create_metric flag: a simple metric of the same name is declared in
      # _metrics.yml, so that this number carries a definition and an
      # assumptions note rather than appearing as a bare measure proxy. Same
      # convention as eligible_premium_accounts.
      - name: deferred_billings_usd
        agg: sum
        expr: deferred_billings_usd
