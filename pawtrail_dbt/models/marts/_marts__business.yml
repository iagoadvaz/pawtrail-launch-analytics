version: 2

models:
  - name: dim_pricing
    columns:
      - name: pet_tier
        tests:
          - unique
          - not_null
          - accepted_values:
              arguments:
                values: ['small', 'medium', 'large']

  # fct_premium_base is the state reference for the whole project: it is the
  # only model with one guaranteed-unique row per state, so every other model's
  # state column is tested against it.
  - name: fct_premium_base
    columns:
      - name: state
        tests:
          - unique
          - not_null

  - name: fct_marketing_spend
    columns:
      - name: channel
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['self_serve', 'sales_assisted']

  - name: fct_sales_pitches
    columns:
      - name: pitch_id
        tests:
          - unique
          - not_null
      - name: state
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_premium_base')
                field: state

  - name: fct_weekly_attach
    columns:
      - name: weekly_attach_key
        tests:
          - unique
          - not_null
      # The state x week spine is densified (see fct_weekly_attach.sql), so a
      # state appearing here that is absent from the addressable base means
      # the spine invented a row. That row's own cumulative_subscriptions is
      # still internally consistent (monotonically non-decreasing week over
      # week) so nothing about the SQL would surface the problem; this
      # relationships test against fct_premium_base is what catches it.
      - name: state
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_premium_base')
                field: state
      - name: attach_rate
        tests:
          - not_null

  - name: fct_weekly_channel_economics
    columns:
      - name: channel_week_key
        tests:
          - unique
          - not_null
      - name: channel
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['self_serve', 'sales_assisted']
      - name: new_subscriptions
        tests:
          - not_null
      # Guards the spend join: on a week that acquired somebody, cac can only be
      # null if fct_marketing_spend failed to join. Without this test a
      # week-boundary mismatch produces an all-null CAC chart and still builds
      # green.
      #
      # The `where` is what makes the guard honest rather than merely quiet. The
      # model carries every week that spent money, including weeks that acquired
      # nobody -- the last week of a launch always looks like that, since its
      # spend has not converted yet -- and cac is genuinely undefined there:
      # dividing real spend by zero subscriptions has no answer, and 0 or
      # infinity would both be inventions. Dropping the test instead would give
      # up the join guard entirely; scoping it keeps it exactly as strong as it
      # was for the rows it was written about. The complementary direction --
      # spend that never reaches the mart at all -- is
      # assert_channel_economics_spend_reconciles.
      - name: cac
        tests:
          - not_null:
              config:
                where: "new_subscriptions > 0"

  - name: fct_subscription_unit_economics
    columns:
      - name: account_id
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_accounts')
                field: account_id
      - name: channel
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['self_serve', 'sales_assisted']
      - name: contribution_margin_per_cycle
        tests:
          - not_null
      - name: allocated_cac_usd
        tests:
          - not_null
      - name: breakeven_cycles
        tests:
          - not_null

  - name: fct_fulfillment_waste
    columns:
      - name: account_id
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_accounts')
                field: account_id
      - name: waste_reason
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['kit_lost', 'late_kit_no_activation', 'never_logged_in']
      - name: wasted_fulfillment_usd
        tests:
          - not_null

  - name: fct_weekly_channel_effective_cac
    columns:
      - name: effective_cac_key
        tests:
          - unique
          - not_null
      - name: channel
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['self_serve', 'sales_assisted']
      - name: new_subscriptions
        tests:
          - not_null
      # Scoped to weeks that acquired somebody, for the same reason the `cac`
      # test on fct_weekly_channel_economics is. That mart carries every week
      # that spent money, including the launch's final week, which converted
      # nobody -- effective_cac divides by new_subscriptions and is genuinely
      # undefined there. Unscoped, this test fails on exactly those 2 rows the
      # moment the F1 spend-leak fix lands, and F1 is a prerequisite of this
      # phase. The complementary guard, that no spend goes missing, is
      # assert_channel_economics_spend_reconciles upstream.
      - name: effective_cac
        tests:
          - not_null:
              config:
                where: "new_subscriptions > 0"
      - name: wasted_fulfillment_usd
        tests:
          - not_null

  - name: fct_state_saturation
    columns:
      - name: state
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('fct_premium_base')
                field: state
      - name: penetration
        tests:
          - not_null
      - name: margin_share
        tests:
          - not_null
